name: generate profile

on:
  schedule:
    # Rebuild daily so GitHub stats stay fresh.
    - cron: "0 0 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/generate-profile.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: generate-profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Generate profile.svg
        run: npm run generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/profile.svg
          git diff --cached --quiet || git commit -m "chore: regenerate profile.svg"
          git push
